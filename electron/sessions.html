<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Sessions</title>
<link rel="stylesheet" href="aither-tokens.css" />
<link rel="stylesheet" href="aither-ui.css" />
<style>
  /* Components (buttons, badges, empty states, section captions) come from
     aither-ui.css, colours and type from aither-tokens.css (GENERATED from Veil's
     tokens by AitherOS/dev/tools/gen_desk_tokens.py). This sheet only lays the pane
     out: a session list on the left, the live transcript on the right. */

  /* ONE chrome. Inside the console the shell's bar already names this pane, so the
     pane's own title is the double header from the owner's 2026-09-20 screenshots.
     console-preload.cjs sets .embedded per frame; detached into its own window the
     page is not embedded and keeps its title, because there it is the only one. */
  .embedded .bar .title { display: none; }
  .bar .ui-sub { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ui-head.bar { border-bottom: 1px solid var(--line); }

  main { display: grid; grid-template-columns: minmax(320px, 34%) 1fr; }
  #list { border-right: 1px solid var(--line); overflow-y: auto; overflow-x: hidden; min-height: 0; }
  /* Sessions are grouped by what they need from YOU, because that is the question
     the pane exists to answer. It used to be one flat list in directory order. */
  .group { position: sticky; top: 0; z-index: 1; background: var(--bg-sunk);
    padding: 10px 14px 6px; display: flex; align-items: center; gap: 8px; }
  .group.needs { color: var(--warn); }
  .row { padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
    display: grid; gap: 4px; border-left: 2px solid transparent; }
  .row:hover { background: var(--surface-900); }
  .row.sel { background: var(--panel); border-left-color: var(--brand); }
  .row .top { display: flex; align-items: baseline; gap: 8px; }
  /* The name is WHAT the session is about, and it wraps. Every row used to open with
     the same "AitherOS-Fresh develop 07:34 - waiting for you - " and then cut off --
     eighteen rows that read identically, behind a horizontal scrollbar. */
  .row .name { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; line-height: 1.35;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .row .sum { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ui-badge.exited { opacity: .55; }
  /* Sessions S1: each row says what it is doing (task, status, where, last prompt,
     how long ago) and what you can DO to it. A verb the daemon cannot honour is
     disabled WITH the daemon's reason beside it, never hidden. */
  .row .where { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
  .row .cwd { font-family: var(--font-mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .row .prompt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--surface-300); }
  .row .acts { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .row .why { font-size: 11px; color: var(--muted); }
  .row .compose { display: grid; gap: 6px; }
  .row .compose textarea { min-height: 54px; resize: vertical; font: inherit; }
  .row .result { font-size: 11px; }
  .row .result.bad { color: var(--bad); }
  .row .result.good { color: var(--ok); }
  #newBar { display: none; gap: 6px; align-items: center; padding: 8px 14px; border-bottom: 1px solid var(--line); }
  #newBar.open { display: flex; }
  #newBar .ui-input { flex: 1; min-width: 0; }
  #newBar .ui-select { width: auto; min-width: 150px; }

  #side { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  #tailBar { padding: 8px 14px; border-bottom: 1px solid var(--line); }
  #tailWho { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #tail { margin: 0; padding: 12px 16px; overflow: auto; min-height: 0; white-space: pre-wrap;
    word-break: break-word; font: 12px/1.5 var(--font-mono); }
  #tail > div { padding: 2px 0; }
  #tail .role { color: var(--brand); }
  #tail .tool { color: var(--warn); }
  #tail .dim { color: var(--muted); }
</style>
</head>
<body class="ui">
  <header class="ui-head bar">
    <h1 class="title">Sessions</h1>
    <span class="ui-sub" id="state">loading…</span>
    <span class="ui-grow"></span>
    <button class="ui-btn ui-small ui-primary" id="newSession">New session</button>
    <button class="ui-btn ui-small" id="refresh">Refresh</button>
  </header>
  <div id="newBar" class="ui-row">
    <select id="newHarness" class="ui-select" aria-label="Harness"><option value="claude">Claude Code</option></select>
    <input id="newCwd" class="ui-input" aria-label="Working directory" placeholder="working directory" />
    <button class="ui-btn ui-small ui-primary" id="newStart">Start</button>
    <button class="ui-btn ui-small ui-ghost" id="newCancel">Cancel</button>
    <span id="newNote" class="ui-note"></span>
  </div>
  <main class="ui-body ui-flush">
    <div id="list"><div class="ui-empty">loading sessions…</div></div>
    <div id="side">
      <div id="tailBar" class="ui-row">
        <span id="tailWho" class="ui-grow">No session selected</span>
        <span id="tailNote" class="ui-note"></span>
      </div>
      <pre id="tail" class="ui-empty">Pick a session to watch its transcript live.</pre>
    </div>
  </main>

<script>
"use strict";
// The Sessions pane. Slice 1 observed; sessions S1 adds the verbs, and ONLY the
// ones the daemon's per-row `actions` allows -- a disabled verb shows the
// daemon's own why_not text. All content is rendered with textContent: a
// transcript is model output and is DATA, never markup.

const listEl = document.getElementById("list");
const stateEl = document.getElementById("state");
const tailEl = document.getElementById("tail");
const tailWho = document.getElementById("tailWho");
const tailNote = document.getElementById("tailNote");

let sessions = [];
let selected = null; // session object
let pinnedToBottom = true;

function say(text) { stateEl.textContent = text || ""; }

function ageOf(ts) {
  if (!ts) return "";
  const ms = ts > 1e12 ? ts : ts * 1000; // the daemon documents unix seconds
  const s = Math.max(0, Math.floor((Date.now() - ms) / 1000));
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}

function pill(text, cls) {
  const el = document.createElement("span");
  el.className = "ui-badge" + (cls ? " " + cls : "");
  el.textContent = text;
  return el;
}

function statusClass(status) {
  const s = String(status || "");
  if (s === "working") return "working ui-ok";
  if (s.startsWith("waiting")) return "waiting ui-warn";
  if (s === "exited") return "exited";
  return "";
}

function steerPill(cap) {
  const c = String(cap || "none");
  if (c === "full") return pill("steerable", "steer ui-ok");
  if (c === "turn-boundary") return pill("steer @ turn", "steer turn ui-warn");
  return pill("watch only", "steer none");
}

/**
 * A session title is "<repo> <branch> <HH:MM> - <needs-you?> - <last human prompt>"
 * (room-actor naming). The repo/branch/time is the SAME on nearly every row, so as a
 * heading it made eighteen rows indistinguishable. Split it: `about` is the prompt
 * (what tells sessions apart), `where` is the rest, shown small.
 */
function splitTitle(title) {
  const parts = String(title || "").split(" - ");
  if (parts.length < 2) return { about: String(title || ""), where: "" };
  const where = parts.shift();
  const rest = parts.filter((part) => !/^(waiting for you|maybe blocked|working|idle)$/i.test(part.trim()));
  return { about: (rest.length ? rest : parts).join(" - "), where };
}

/** needs-you first, then working, then the rest: the order of who is waiting on whom. */
function groupOf(session) {
  const status = String(session.status || "");
  const title = String(session.title || "");
  if (status.startsWith("waiting") || /waiting for you|maybe blocked/i.test(title)) return "needs";
  if (status === "working") return "working";
  return "quiet";
}
const GROUP_LABELS = { needs: "Needs you", working: "Working", quiet: "Quiet" };

/** "C:\a\b\repo" -> "repo": the checkout a session works in, at a glance. */
function baseName(p) {
  const parts = String(p || "").split(/[\\/]+/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : "";
}

/** The session's own short name, else the title's first segment, else its id. */
function taskName(s) {
  const split = splitTitle(s.title);
  return String(s.name || "").trim() || split.where || split.about || String(s.id || "").slice(0, 8);
}

/** The daemon's verdict for one verb: { can, why }. An older daemon sends no
 *  `actions`; then nothing is offered, and the reason says so. */
function verb(s, name) {
  const a = s && s.actions;
  if (!a || typeof a !== "object") return { can: false, why: "this daemon predates session verbs -- restart it" };
  const why = (a.why_not && a.why_not[name]) || "";
  return { can: a[name] === true, why };
}

let composeFor = null; // session id whose inline message box is open
let draft = "";
const results = {}; // session id -> { text, good }

function actButton(label, s, name, onClick, cls) {
  const v = verb(s, name);
  const b = document.createElement("button");
  b.className = "ui-btn ui-small" + (cls ? " " + cls : "");
  b.textContent = label;
  b.dataset.verb = name;
  b.disabled = !v.can;
  if (!v.can) b.title = v.why;
  b.addEventListener("click", (ev) => { ev.stopPropagation(); if (v.can) onClick(); });
  return b;
}

function note(id, text, good) {
  results[id] = { text, good };
  renderList();
}

async function doFocus(s) {
  const r = await window.aitherSessions.focus(s.id);
  const body = (r && r.body) || {};
  const extra = body.remote_url ? " -- also at " + body.remote_url : "";
  const good = Boolean(r && r.ok && body.ok !== false);
  note(s.id, r && r.ok ? (body.detail || "focused") + extra : "focus: " + ((r && r.note) || "failed"), good);
}

async function doInterrupt(s) {
  const r = await window.aitherSessions.interrupt(s.id);
  note(s.id, r && r.ok ? "interrupted" : "interrupt: " + ((r && r.note) || "failed"), Boolean(r && r.ok));
}

async function doSend(s, text) {
  const r = await window.aitherSessions.message(s.id, text);
  if (r && r.ok) {
    composeFor = null;
    draft = "";
    note(s.id, "queued -- delivered at its next prompt", true);
  } else {
    note(s.id, "message: " + ((r && r.note) || "failed"), false);
  }
}

function buildRow(s) {
  const row = document.createElement("div");
  row.className = "row" + (selected && selected.id === s.id ? " sel" : "");
  row.dataset.id = String(s.id || "");
  const top = document.createElement("div");
  top.className = "top";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = taskName(s);
  name.title = (s.cwd || "") + (s.harness_label ? " · " + s.harness_label : "") + (s.origin ? " · " + s.origin : "");
  const age = document.createElement("span");
  age.className = "age ui-note";
  age.textContent = ageOf(s.last_activity_at);
  age.title = "last activity";
  top.append(name, pill(String(s.status || "?"), statusClass(s.status)), age);
  row.appendChild(top);

  const where = document.createElement("div");
  where.className = "where";
  const cwd = document.createElement("span");
  cwd.className = "cwd";
  cwd.textContent = baseName(s.cwd) || "?";
  cwd.title = s.cwd || "";
  const prompt = document.createElement("span");
  prompt.className = "prompt ui-note";
  const said = String(s.last_prompt || "").trim() || splitTitle(s.title).about || "";
  prompt.textContent = said ? "\u201c" + said + "\u201d" : "";
  prompt.title = said;
  where.append(cwd, prompt);
  row.appendChild(where);

  if (s.last_activity_summary) {
    const sum = document.createElement("div");
    sum.className = "sum ui-meta ui-note";
    sum.textContent = s.last_activity_summary;
    row.appendChild(sum);
  }

  const acts = document.createElement("div");
  acts.className = "acts";
  acts.append(
    actButton("Focus", s, "focus", () => void doFocus(s)),
    actButton("Message", s, "message", () => {
      composeFor = composeFor === s.id ? null : s.id;
      renderList();
      const box = listEl.querySelector('.row[data-id="' + CSS.escape(String(s.id)) + '"] textarea');
      if (box) box.focus();
    }),
    actButton("Interrupt", s, "interrupt", () => void doInterrupt(s), "ui-danger"),
    steerPill(s.steer_capability),
  );
  row.appendChild(acts);
  // The first disabled verb's reason, in words: a greyed button alone says nothing.
  const blocked = ["interrupt", "message", "focus"].map((n) => verb(s, n)).find((v) => !v.can && v.why);
  if (blocked) {
    const why = document.createElement("div");
    why.className = "why";
    why.textContent = blocked.why;
    row.appendChild(why);
  }

  if (composeFor === s.id) {
    const compose = document.createElement("div");
    compose.className = "compose";
    const box = document.createElement("textarea");
    box.className = "ui-input";
    box.placeholder = "Queued for its next prompt (Ctrl+Enter sends, Esc closes)";
    box.value = draft;
    box.addEventListener("input", () => { draft = box.value; });
    box.addEventListener("click", (ev) => ev.stopPropagation());
    const send = document.createElement("button");
    send.className = "ui-btn ui-small ui-primary";
    send.textContent = "Send";
    const go = () => { if (box.value.trim()) void doSend(s, box.value); };
    send.addEventListener("click", (ev) => { ev.stopPropagation(); go(); });
    box.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); go(); }
      if (ev.key === "Escape") { composeFor = null; renderList(); }
    });
    compose.append(box, send);
    row.appendChild(compose);
  }
  const res = results[s.id];
  if (res) {
    const r = document.createElement("div");
    r.className = "result " + (res.good ? "good" : "bad");
    r.textContent = res.text;
    row.appendChild(r);
  }
  row.addEventListener("click", () => select(s));
  return row;
}

function renderList() {
  listEl.textContent = "";
  if (!sessions.length) {
    const ph = document.createElement("div");
    ph.className = "ui-empty";
    ph.textContent = "No sessions in the directory.";
    listEl.appendChild(ph);
    return;
  }
  const ordered = ["needs", "working", "quiet"].flatMap((group) =>
    sessions.filter((session) => groupOf(session) === group).map((session) => ({ group, session })));
  let lastGroup = null;
  for (const { group, session: s } of ordered) {
    if (group !== lastGroup) {
      lastGroup = group;
      const heading = document.createElement("div");
      heading.className = "group ui-section" + (group === "needs" ? " needs" : "");
      const count = ordered.filter((entry) => entry.group === group).length;
      heading.innerHTML = "";
      heading.append(document.createTextNode(GROUP_LABELS[group]));
      const n = document.createElement("span");
      n.className = "n " + (group === "needs" ? "ui-count" : "ui-badge");
      n.textContent = String(count);
      heading.appendChild(n);
      listEl.appendChild(heading);
    }
    listEl.appendChild(buildRow(s));
  }
}

function select(s) {
  selected = s;
  pinnedToBottom = true;
  tailWho.textContent = s.title || s.id;
  tailEl.textContent = "loading…";
  renderList();
  void refreshTail();
}

/** JSONL line -> one readable line, or null to skip. Transcript rows are whole
 *  events; printing raw JSON would be a wall nobody reads. */
function formatLine(raw) {
  try {
    const o = JSON.parse(raw);
    if (o.type === "assistant" && o.message && Array.isArray(o.message.content)) {
      const parts = [];
      for (const b of o.message.content) {
        if (b.type === "text" && b.text) parts.push(["A", b.text]);
        else if (b.type === "tool_use") parts.push(["T", b.name]);
      }
      if (parts.length) return parts;
    }
    if (o.type === "user" && o.message && typeof o.message.content === "string") {
      return [["U", o.message.content.slice(0, 400)]];
    }
    if (o.type === "result" && typeof o.result === "string") return [["R", o.result.slice(0, 600)]];
    return null;
  } catch {
    return [["?", raw.slice(0, 300)]];
  }
}

function renderTail(result) {
  tailEl.classList.remove("ui-empty");
  tailEl.textContent = "";
  if (!result || result.ok !== true) {
    tailNote.textContent = "";
    tailEl.classList.add("ui-empty");
    tailEl.textContent = (result && result.note) || "cannot read the transcript";
    return;
  }
  tailNote.textContent = result.truncated ? "tail (windowed)" : "full";
  for (const raw of result.lines) {
    const parts = formatLine(raw);
    if (!parts) continue;
    for (const [kind, text] of parts) {
      const line = document.createElement("div");
      const tag = document.createElement("span");
      tag.className = kind === "T" ? "tool" : kind === "?" ? "dim" : "role";
      tag.textContent = kind === "A" ? "assistant: " : kind === "U" ? "you: " : kind === "T" ? "⚙ " : kind === "R" ? "result: " : "";
      const body = document.createElement("span");
      body.textContent = text;
      line.append(tag, body);
      tailEl.appendChild(line);
    }
  }
  if (pinnedToBottom) tailEl.scrollTop = tailEl.scrollHeight;
}

tailEl.addEventListener("scroll", () => {
  pinnedToBottom = tailEl.scrollHeight - tailEl.scrollTop - tailEl.clientHeight < 24;
});

async function refreshList() {
  try {
    const result = await window.aitherSessions.list();
    if (!result || result.ok !== true) {
      say((result && result.note) || "daemon unreachable");
      sessions = [];
      renderList();
      return;
    }
    sessions = result.sessions || [];
    say(result.note + " — " + new Date().toLocaleTimeString());
    // A poll must not rebuild the row under someone typing a message.
    if (composeFor && document.activeElement && document.activeElement.tagName === "TEXTAREA") return;
    if (!selected && sessions.length) {
      // Land on the session most likely to be the reason the pane was opened.
      const first = ["needs", "working", "quiet"].map((g) => sessions.find((x) => groupOf(x) === g)).find(Boolean);
      if (first) { select(first); return; }
    }
    if (selected) {
      const fresh = sessions.find((s) => s.id === selected.id);
      if (fresh) selected = fresh; // keep the tail open across refreshes
    }
    renderList();
  } catch (error) {
    say("list failed: " + String((error && error.message) || error));
  }
}

async function refreshTail() {
  if (!selected) return;
  try {
    const result = await window.aitherSessions.tail(selected.id, selected.transcript_path);
    renderTail(result);
  } catch (error) {
    renderTail({ ok: false, note: "tail failed: " + String((error && error.message) || error) });
  }
}

document.getElementById("refresh").addEventListener("click", () => { void refreshList(); void refreshTail(); });

const newBar = document.getElementById("newBar");
const newHarness = document.getElementById("newHarness");
const newCwd = document.getElementById("newCwd");
const newNote = document.getElementById("newNote");
document.getElementById("newSession").addEventListener("click", async () => {
  newBar.classList.toggle("open");
  if (!newBar.classList.contains("open")) return;
  newNote.textContent = "";
  const h = await window.aitherSessions.harnesses();
  if (h && h.ok && h.harnesses.length) {
    newHarness.textContent = "";
    for (const { id, label } of h.harnesses) {
      const opt = document.createElement("option");
      opt.value = id;
      opt.textContent = label;
      if (id === "claude") opt.selected = true;
      newHarness.appendChild(opt);
    }
  } else if (h && !h.ok) {
    newNote.textContent = "harnesses: " + h.note;
  }
  if (!newCwd.value && h && h.defaultCwd) newCwd.value = h.defaultCwd;
  newCwd.focus();
});
document.getElementById("newCancel").addEventListener("click", () => newBar.classList.remove("open"));
document.getElementById("newStart").addEventListener("click", async () => {
  newNote.textContent = "starting…";
  const r = await window.aitherSessions.spawn({ cwd: newCwd.value.trim(), harness: newHarness.value });
  if (r && r.ok) {
    newNote.textContent = "started " + String((r.body && r.body.id) || "").slice(0, 8);
    newBar.classList.remove("open");
    void refreshList();
  } else {
    newNote.textContent = "could not start: " + ((r && r.note) || "failed");
  }
});

void refreshList();
setInterval(() => { void refreshList(); }, 5000);
setInterval(() => { void refreshTail(); }, 2500);
</script>
</body>
</html>
